[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docseed"
version = "0.1.0"
description = "Raspberry Pi 5 で動くローカルのドキュメントサーバー（保存・共有・OCR・検索）"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.18",
  "argon2-cffi>=23.1",
  "sqlite-vec>=0.1.6",
  "filetype>=1.2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
]

[project.scripts]
docseed = "docseed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docseed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["scripts/poc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI の Depends() / Form() は引数の既定値で書く
