[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docseed"
version = "0.7.0"
description = "Raspberry Pi 5 で動くローカルのドキュメントサーバー（保存・共有・OCR・検索）"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.18",
  "argon2-cffi>=23.1",
  "sqlite-vec>=0.1.6",
  "filetype>=1.2",
  "tzdata>=2024.1",
  # worker（OCR・埋め込み）。torch は使わない（ONNX Runtime + tokenizers で推論する）
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "rapidocr>=3.10",
  "pypdfium2>=4.30",
  "pillow>=11.3",          # AVIF の読み込み（標準の wheel に libavif が入る）
  "pillow-heif>=1.0",      # HEIC / HEIF の読み込み（Phase 6）
  "huggingface-hub>=0.26",
  # Office 文書（docx / xlsx / pptx）のテキスト抽出（Phase 5）
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  # ログイン（Phase 7）: パスキー・確認コードの QR コード・OIDC（ID トークンの検証と提供者との通信）
  "webauthn>=2.5,<4",
  "segno>=1.6",
  "joserfc>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# モデルの取得と ONNX への変換（docseed fetch-models）だけで使う。初回に 1 度だけ必要
tools = [
  "torch>=2.4",
  "sentence-transformers[onnx]>=5.0",
  "sentencepiece>=0.2",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
docseed = "docseed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docseed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["scripts/poc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI の Depends() / Form() は引数の既定値で書く
