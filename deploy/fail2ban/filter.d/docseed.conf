# docseed のセキュリティログ（<DOCSEED_DATA_DIR>/logs/security.log）を読むフィルタ。
# docs/design/security.md 9 章。scripts/ops/install-fail2ban.sh が /etc/fail2ban/filter.d/ に置く。
#
# ログの形（src/docseed/ratelimit.py の security_event）:
#   2026-11-09T14:00:00+0000 docseed-security event=login_failed ip=203.0.113.5
#   2026-11-09T14:00:01+0000 docseed-security event=rate_limited ip=2001:db8::1 rule=share

[Definition]
failregex = ^ docseed-security event=(?:login_failed|second_factor_failed|reauth_failed|passkey_failed|share_password_failed|share_invalid|rate_limited) ip=<ADDR>(?: \S+)*$
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z
