# docs/design/deployment.md 2 章
# 初回:
#   cp .env.example .env → 値を設定
#   docker compose --profile tools run --rm tools     # モデルの取得（初回だけ。数分）
#   docker compose up -d --build
#   docker compose exec api docseed create-admin --username <名前>
# コンテナの強化（docs/design/deployment.md 2.3）。インターネットに公開しても、1 つのコンテナが乗っ取られたときの
# 被害を小さくする:
#   - read_only        : イメージの中を書き換えさせない（書けるのはデータディレクトリのボリュームと /tmp だけ）
#   - cap_drop: [ALL]  : Linux の特権（capabilities）をすべて外す
#   - no-new-privileges: setuid などで権限を上げさせない
#   - /tmp は RAM 上（tmpfs）。大きなアップロードの一時ファイルは TMPDIR でデータディレクトリ（SSD）に置く
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=256m,mode=1777

services:
  caddy:
    # acme_dns のときは DNS のプラグイン入りの Caddy を使う（下の caddy-acme でビルドし、
    # .env の DOCSEED_CADDY_IMAGE=docseed-caddy:latest にする）
    image: ${DOCSEED_CADDY_IMAGE:-caddy:2}
    <<: *hardening
    # コンテナの中では root で 80 / 443 を待ち受けるため、その権限だけ戻す
    cap_add: [NET_BIND_SERVICE]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /config:size=16m        # Caddy が設定の控え（autosave.json）を書く場所
    pids_limit: 128
    # ポート。80 / 443 が他のサービスで使われている場合は .env で変える。
    # Caddy はコンテナの中でも同じ番号で待ち受ける（転送先の URL にこの番号を使わせるため）
    ports:
      - "${DOCSEED_HTTPS_PORT:-443}:${DOCSEED_HTTPS_PORT:-443}"
      - "${DOCSEED_HTTP_PORT:-80}:${DOCSEED_HTTP_PORT:-80}"
    environment:
      DOCSEED_HOST: ${DOCSEED_HOST}
      # 空だと Caddy の {$DOCSEED_LAN_IP:localhost} の既定値が使われず default_sni が空になるので、ここで補う
      DOCSEED_LAN_IP: ${DOCSEED_LAN_IP:-localhost}
      DOCSEED_HTTPS_PORT: ${DOCSEED_HTTPS_PORT:-443}
      DOCSEED_HTTP_PORT: ${DOCSEED_HTTP_PORT:-80}
      # 証明書の方式（docker/Caddyfile の冒頭を参照）。file のときは DOCSEED_TLS_CERT_DIR を /certs に読み取り専用で入れる
      DOCSEED_TLS_MODE: ${DOCSEED_TLS_MODE:-internal}
      DOCSEED_TLS_CERT: ${DOCSEED_TLS_CERT:-}
      DOCSEED_TLS_KEY: ${DOCSEED_TLS_KEY:-}
      DOCSEED_ACME_EMAIL: ${DOCSEED_ACME_EMAIL:-}
      DOCSEED_ACME_DNS_TOKEN: ${DOCSEED_ACME_DNS_TOKEN:-}
      DOCSEED_ACME_STAGING: ${DOCSEED_ACME_STAGING:-false}
      # 「内側」とみなす接続元（管理画面などを開ける範囲。docker/Caddyfile の冒頭を参照）。空だと Caddy の既定値が使われないので、ここで補う
      DOCSEED_TRUSTED_NETS: ${DOCSEED_TRUSTED_NETS:-private_ranges 100.64.0.0/10}
      # cloudflared だけがいるネットワーク。ここからの CF-Connecting-IP だけを信頼する（docker/Caddyfile の冒頭）
      DOCSEED_TUNNEL_SUBNET: ${DOCSEED_TUNNEL_SUBNET:-10.213.47.0/28}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DOCSEED_TLS_CERT_DIR:-./docker/certs}:/certs:ro
      # tailscale のとき: tailscaled.sock に問い合わせて証明書をもらう（Tailscale が無ければ空のディレクトリ）
      - ${DOCSEED_TAILSCALE_SOCKET_DIR:-/var/run/tailscale}:/var/run/tailscale:ro
      - ${DOCSEED_DATA_DIR:-/srv/docseed}/caddy:/data
    networks: [default, tunnel]
    depends_on: [api]
    restart: unless-stopped

  # Cloudflare Tunnel（任意。docs/design/security.md 10 章、README の「ポートを開けずに公開する」）。
  # ルーターのポートを開けずに、Cloudflare 経由でインターネットに公開する。Cloudflare の管理画面で作った
  # トンネルのトークンを .env の DOCSEED_TUNNEL_TOKEN に入れ、COMPOSE_PROFILES に tunnel を足すと起動する。
  # 転送先（Public hostname の Service）は https://caddy:<DOCSEED_HTTPS_PORT>
  cloudflared:
    profiles: ["tunnel"]
    image: ${DOCSEED_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    <<: *hardening
    pids_limit: 64
    mem_limit: 256m
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${DOCSEED_TUNNEL_TOKEN:-}
    # caddy とだけ同じネットワークに置く（api・worker には直接届かない）
    networks: [tunnel]
    depends_on: [caddy]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    image: docseed:latest
    command: ["docseed", "serve", "--port", "8000"]
    <<: *hardening
    pids_limit: 256
    env_file: .env
    environment:
      DOCSEED_DATA_DIR: /srv/docseed
      # アップロードの受信中の一時ファイル（最大 1GB）を RAM ではなく SSD に置く
      TMPDIR: /srv/docseed/files/.tmp
      HF_HOME: /tmp/hf          # docseed fetch-models --llm の取得で使う
      # 証明書の監視（6 時間ごとに Caddy へ TLS で接続して期限を読む）
      DOCSEED_TLS_CHECK_ADDR: caddy:${DOCSEED_HTTPS_PORT:-443}
    volumes:
      - ${DOCSEED_DATA_DIR:-/srv/docseed}:/srv/docseed
      - /sys/class/thermal:/host/thermal:ro
    # default: Caddy から届き、外部（Webhook の通知・OIDC など）へ通信する。
    # internal: 質問に答えるときに llm サービスを呼ぶ（internal は外部へ出られないネットワーク）
    networks: [default, internal]
    mem_limit: 1536m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    restart: unless-stopped

  # 文字の読み取り（OCR）と埋め込み。外部へは通信しない（モデルは tools で事前に取得する）
  worker:
    image: docseed:latest
    command: ["docseed", "worker"]
    <<: *hardening
    pids_limit: 256
    env_file: .env
    environment:
      DOCSEED_DATA_DIR: /srv/docseed
      TMPDIR: /srv/docseed/files/.tmp
    volumes:
      - ${DOCSEED_DATA_DIR:-/srv/docseed}:/srv/docseed
      - /sys/class/thermal:/host/thermal:ro
    mem_limit: 3g
    networks: [internal]
    depends_on: [api]
    healthcheck:
      disable: true
    stop_grace_period: 30s
    logging: *logging
    restart: unless-stopped

  # URL の取り込み（Web クリップ）の取得。外部へ通信するのはこれだけ（worker は通信しないまま）。
  # .env で DOCSEED_WEBCLIP_ENABLED=true と COMPOSE_PROFILES=webclip にすると起動する
  fetcher:
    profiles: ["webclip"]
    image: docseed:latest
    command: ["docseed", "fetcher"]
    <<: *hardening
    pids_limit: 128
    env_file: .env
    environment:
      DOCSEED_DATA_DIR: /srv/docseed
      TMPDIR: /srv/docseed/files/.tmp
    volumes:
      - ${DOCSEED_DATA_DIR:-/srv/docseed}:/srv/docseed
    mem_limit: 384m
    depends_on: [api]
    logging: *logging
    restart: unless-stopped

  # 要約と新しいタグの提案（worker が呼ぶ）と、質問への答え（api が呼ぶ）の LLM。internal ネットワークだけ（外部と通信しない）。
  # 枠（--parallel）を 2 にして、要約の途中でも質問に答えられるようにする（1 つの枠の文脈は -c / 枠の数 = 4096）。
  # .env で DOCSEED_LLM_ENABLED=true と COMPOSE_PROFILES=llm（Web クリップも使うなら webclip,llm）にすると起動する。
  # モデルは docker compose exec api docseed fetch-models --llm <名前> で models/llm/ に置く
  llm:
    profiles: ["llm"]
    image: ${DOCSEED_LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    <<: *hardening
    pids_limit: 128
    command: ["-m", "/models/llm/${DOCSEED_LLM_MODEL:-LFM2.5-1.2B-JP-Q4_K_M.gguf}",
              "--host", "0.0.0.0", "--port", "8080", "-t", "${DOCSEED_LLM_THREADS:-3}",
              "-c", "${DOCSEED_LLM_CTX:-8192}", "--parallel", "${DOCSEED_LLM_PARALLEL:-2}"]
    volumes:
      - ${DOCSEED_DATA_DIR:-/srv/docseed}/models:/models:ro
    mem_limit: 2g
    networks: [internal]
    logging: *logging
    restart: unless-stopped

  # acme_dns 用の Caddy（DNS のプラグイン入り）のビルドだけに使う:
  #   docker compose --profile acme build caddy-acme
  caddy-acme:
    profiles: ["acme"]
    build:
      context: docker/caddy
    image: docseed-caddy:latest
    command: ["caddy", "version"]

  # モデルの取得と ONNX への変換（初回とモデル変更時だけ）: docker compose --profile tools run --rm tools
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tools
    image: docseed-tools:latest
    # モデルの変換でキャッシュを書くので read_only にはしない
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["docseed", "fetch-models"]
    env_file: .env
    environment:
      DOCSEED_DATA_DIR: /srv/docseed
    volumes:
      - ${DOCSEED_DATA_DIR:-/srv/docseed}:/srv/docseed

networks:
  default: {}
  internal:
    internal: true
  # cloudflared と caddy だけのネットワーク。サブネットを固定し、Caddy はここからの CF-Connecting-IP だけを信頼する
  tunnel:
    ipam:
      config:
        - subnet: ${DOCSEED_TUNNEL_SUBNET:-10.213.47.0/28}
