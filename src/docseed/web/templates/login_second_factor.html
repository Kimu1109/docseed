{% extends "base.html" %}
{% block title %}確認コード{% endblock %}
{% block bare %}
<main class="login">
  <div class="login-box">
    <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span>docseed</div>
    <p class="login-lead">認証アプリに表示されている 6 桁の確認コードを入力してください。</p>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/auth/second-factor" class="form">
      <label>確認コード
        <input name="code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="none" required autofocus
               maxlength="20" placeholder="123456">
      </label>
      <button type="submit" class="btn btn-primary btn-block">{{ icon("pin") }}確認</button>
    </form>
    <p class="muted small">認証アプリの端末をなくしたときは、確認コードの代わりに復旧コード（xxxx-xxxx-xxxx）を入力できます。
      復旧コードも無いときは管理者に連絡してください。</p>
    <p class="small"><a href="/login">{{ icon("arrow_back") }} 最初からやり直す</a></p>
  </div>
</main>
{% endblock %}
