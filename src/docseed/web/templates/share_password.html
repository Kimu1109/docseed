{% extends "base.html" %}
{% block title %}{{ _("共有リンク") }}{% endblock %}
{% block bare %}
<main class="login">
  <div class="login-box">
    <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span>docseed</div>
    {{ icon("lock", cls="hero-icon") }}
    <p class="login-lead">{{ _("このリンクにはパスワードが設定されています。共有した人から聞いたパスワードを入力してください。") }}</p>
    {% if error %}<p class="alert" role="alert">{{ _(error) }}</p>{% endif %}
    <form method="post" action="{{ base }}/s/{{ token }}/auth" class="form">
      <label>{{ _("パスワード") }} <input name="password" type="password" required autofocus autocomplete="off"></label>
      <button type="submit" class="btn btn-primary btn-block">{{ icon("lock_open") }}{{ _("開く") }}</button>
    </form>
  </div>
</main>
{% endblock %}
