<button type="button" class="btn{% if small %} btn-sm{% endif %} fav-btn{% if fav %} is-fav{% endif %}" hx-post="{{ base }}/x/favorite"
        hx-vals='{"type": "{{ fav_type }}", "id": {{ fav_id }}, "on": "{{ '0' if fav else '1' }}"{% if small %}, "small": "1"{% endif %}}'
        hx-swap="outerHTML" aria-pressed="{{ 'true' if fav else 'false' }}"
        title="{{ _('お気に入りから外す') if fav else _('お気に入りに入れる') }}">{{ icon("star") }}<span class="lbl">{{ _("お気に入り") }}</span></button>
