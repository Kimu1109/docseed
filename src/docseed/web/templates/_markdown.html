{# Markdown の文書のプレビュー（mdview.py）。呼び出し側が md_html・text_preview・truncated を決めておく。
   「表示 / 元の文字」の切り替えは app.js（data-md-view）。文書の画面・ゴミ箱・共有ページで使う #}
      <div class="md-switch" role="group" aria-label="{{ _("Markdown の表示") }}">
        <button type="button" class="btn btn-sm" data-md-view="rendered" aria-pressed="true">{{ icon("visibility") }}{{ _("表示") }}</button>
        <button type="button" class="btn btn-sm" data-md-view="source" aria-pressed="false">{{ icon("code") }}{{ _("元の文字") }}</button>
      </div>
      <article class="doc md-view" data-md-pane="rendered">{{ md_html }}</article>
      <pre class="textview" data-md-pane="source" hidden>{{ text_preview }}</pre>
      {% if truncated %}<p class="muted">{{ _("先頭の 200 KB だけを表示しています。") }}</p>{% endif %}
