{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block bare %}
<main class="login">
  <div class="login-box">
    <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span>docseed</div>
    <p class="login-lead">書類の保管庫にログインします。</p>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="form">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <label>ユーザー名
        <input name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" required autofocus>
      </label>
      <label>パスワード
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="check"><input type="checkbox" name="remember" value="1"> ログインしたままにする（14 日間）</label>
      <button type="submit" class="btn btn-primary btn-block">ログイン</button>
    </form>
  </div>
</main>
{% endblock %}
