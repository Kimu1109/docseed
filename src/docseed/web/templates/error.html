{% extends "base.html" %}
{% block title %}{{ _("エラー") }}{% endblock %}
{% block bare %}
<main class="login">
  <div class="login-box">
    <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span>docseed</div>
    {{ icon("error", cls="hero-icon") }}
    <h1 class="error-title">{{ detail }}</h1>
    <p class="muted">{{ _("コード {status}", status=status) }}</p>
    <p><a class="btn" href="{{ base }}/">{{ icon("home") }}{{ _("マイファイルに戻る") }}</a></p>
  </div>
</main>
{% endblock %}
