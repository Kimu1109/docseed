{% extends "base.html" %}
{% block title %}{{ _("ゴミ箱") }}{% endblock %}
{% block main %}
<div class="page-head">
  <h1 class="page-title">{{ icon("delete") }} {{ _("ゴミ箱") }}</h1>
  {% if items %}
  <div class="actions">
    <button type="button" class="btn btn-danger" hx-post="{{ base }}/trash/empty" hx-target="#trash" hx-swap="outerHTML"
            hx-confirm="{{ _("ゴミ箱の {items} 件をすべて完全に削除します。元に戻せません。よろしいですか？", items=(items | length)) }}">{{ icon("delete_sweep") }}{{ _("ゴミ箱を空にする") }}</button>
  </div>
  {% endif %}
</div>
<p class="note">{{ icon("schedule") }} {{ _("削除した日から {retention} 日たつと自動的に完全に削除されます。", retention=retention) }}</p>
{% include "_trash_list.html" %}
{% endblock %}
